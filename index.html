<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Banking App Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;font-family:Inter,Arial,sans-serif;color:#15233d;display:flex;justify-content:center;min-height:100vh;padding:32px}
.phone{width:390px;min-height:844px;background:#f7f9fc;border-radius:38px;box-shadow:0 20px 60px #0002;overflow:hidden;position:relative;border:8px solid #111}
.screen{min-height:828px;padding-bottom:80px}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.title{font-size:17px;font-weight:800}.balance{margin:10px 20px;border-radius:18px;padding:22px;background:#2164e8;color:white;min-height:175px;box-shadow:0 10px 25px #2164e833}.row{display:flex;justify-content:space-between}.small{font-size:13px;color:#dce7ff}.visa{font-weight:900;font-style:italic}.amount{font-size:31px;font-weight:900;margin-top:16px}.quickrow{display:flex;justify-content:space-between;padding:18px 20px}.quick{text-align:center;font-size:11px;color:#7e8797}.qi{width:48px;height:48px;border-radius:14px;background:#fff;border:1px solid #eef1f5;display:flex;align-items:center;justify-content:center;margin:auto auto 7px;font-size:20px}.section{display:flex;justify-content:space-between;padding:0 20px;margin:8px 0 10px}.st{font-size:17px;font-weight:800}.blue{color:#2164e8}.tx{margin:0 20px 8px;background:#fff;border-radius:13px;padding:13px 14px;display:flex;align-items:center;gap:12px}.ti{width:40px;height:40px;border-radius:12px;background:#f4f6fa;display:flex;align-items:center;justify-content:center}.txname{font-size:14px;font-weight:800}.date{font-size:11px;color:#7e8797;margin-top:3px}.nav{position:absolute;bottom:0;left:0;right:0;height:78px;background:#fff;border-top:1px solid #edf0f5;display:flex;justify-content:space-around;padding-top:12px}.nav div{text-align:center;color:#7e8797;font-size:10px}.nav .active{color:#2164e8;font-weight:700}.onboard{background:#fff;min-height:828px;padding:22px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;font-size:20px;font-weight:800}.logo{width:42px;height:42px;border-radius:13px;background:#2164e8;color:#fff;display:grid;place-items:center}.art{height:330px;display:grid;place-items:center;position:relative}.circle{width:250px;height:250px;border-radius:50%;background:#eaf1ff;position:absolute}.card{position:absolute;width:145px;height:95px;background:white;border-radius:16px;right:28px;top:100px;box-shadow:0 8px 25px #0002;transform:rotate(-8deg);padding:15px}.person{position:absolute;left:35px;bottom:38px;text-align:center}.head{width:48px;height:48px;border-radius:50%;background:#f3c5a9;margin:auto}.body{width:82px;height:90px;border-radius:38px 38px 0 0;background:#2164e8}.copy{text-align:center;margin-top:auto}.hero{font-size:28px;line-height:34px;font-weight:900}.sub{font-size:14px;line-height:21px;color:#7e8797;margin:12px 0 24px}.btn{height:52px;border:0;border-radius:9px;background:#2164e8;color:#fff;font-weight:800;width:100%;font-size:15px}.ghost{height:52px;border:1px solid #e3e7ee;border-radius:9px;background:#fff;color:#15233d;font-weight:700;width:100%;margin-top:10px}.signin{font-size:12px;color:#7e8797;margin:17px}.back{font-size:25px;cursor:pointer}.field{font-size:14px;font-weight:800;margin:18px 0 10px}.recipient,.input{background:#fff;border:1px solid #e9edf4;border-radius:14px;padding:14px}.recipient{display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:50%;background:#f1c7ad;display:grid;place-items:center;font-weight:900}.input{height:66px;font-size:26px;font-weight:900}.note{height:55px}.success{text-align:center;padding:180px 25px}.check{width:100px;height:100px;border-radius:50%;background:#21b36b;color:white;font-size:52px;display:grid;place-items:center;margin:auto}
</style>
</head>
<body>
<div class="phone">
  <div id="app"></div>
</div>
<script>
const app=document.getElementById('app');
function nav(active){return `<div class="nav"><div class="${active==='Home'?'active':''}" onclick="home()">⌂<br>Home</div><div class="${active==='Transfer'?'active':''}" onclick="transfer()">⇄<br>Transfer</div><div>▣<br>Cards</div><div>◯<br>Account</div></div>`}
function onboarding(){app.innerHTML=`<div class="onboard"><div class="brand"><div class="logo">◈</div>Micheal</div><div class="art"><div class="circle"></div><div class="card">▣<br><hr>▰▰▰</div><div class="person"><div class="head"></div><div class="body"></div></div></div><div class="copy"><div class="hero">Bank on-the-go<br>with our app</div><div class="sub">Manage your finances anytime, anywhere<br>with our online banking app.</div><button class="btn" onclick="home()">Create An Account</button><button class="ghost" onclick="home()">G&nbsp;&nbsp; Sign Up With Google</button><div class="signin">Already a member? <span class="blue">Sign In</span></div></div></div>`}
function home(){app.innerHTML=`<div class="screen"><div class="top"><span></span><div class="title">Good Morning, Micheal</div><span>♧</span></div><div class="balance"><div class="row"><span class="small">Your Balance:</span><span class="visa">VISA</span></div><div class="amount">$25,890.00</div><div class="row" style="margin-top:22px"><span class="small">**** 2322</span><span class="small">12/26</span></div></div><div class="quickrow"><div class="quick" onclick="transfer()"><div class="qi">↗</div>Send</div><div class="quick"><div class="qi">↙</div>Receive</div><div class="quick"><div class="qi">⌗</div>Scan</div><div class="quick"><div class="qi">⚙</div>Settings</div></div><div class="section"><span class="st">Recent Transactions</span><span class="blue">See All</span></div><div class="tx"><div class="ti">●</div><div style="flex:1"><div class="txname">Spotify</div><div class="date">Apr 15, 2023</div></div><b style="color:#f15b62">- $9.99</b></div><div class="tx"><div class="ti">N</div><div style="flex:1"><div class="txname">Netflix</div><div class="date">Apr 15, 2023</div></div><b style="color:#f15b62">- $6.99</b></div><div class="tx"><div class="ti">↗</div><div style="flex:1"><div class="txname">Upwork</div><div class="date">Apr 14, 2023</div></div><b style="color:#21b36b">+ $46.50</b></div>${nav('Home')}</div>`}
function transfer(){app.innerHTML=`<div class="screen"><div class="top"><span class="back" onclick="home()">‹</span><div class="title">Transfer</div><span>♧</span></div><div style="padding:0 20px"><div class="field">Send Money To</div><div class="recipient"><div class="avatar">RF</div><div style="flex:1"><b>Robert Fox</b><div class="date">+960 7879 6548 7753</div></div><span class="blue">✓</span></div><div class="field">Amount</div><input class="input" value="20000" id="amt"><div class="date" style="margin-top:7px">Available balance: $25,890.00</div><div class="field">Note</div><input class="input note" placeholder="Add a note (optional)"><button class="btn" style="margin-top:20px" onclick="success()">Send Money</button></div></div>`}
function success(){app.innerHTML=`<div class="success"><div class="check">✓</div><h1>Transfer Successful</h1><p style="color:#7e8797">$20,000 has been sent to Robert Fox.</p><button class="btn" onclick="home()">Back to Home</button></div>`}
onboarding();
</script>
</body></html>
